<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist — LocalCart</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar-inner">
      <a href="../index.html" class="logo">
        <i data-lucide="shopping-bag"></i> Local<span>Cart</span>
      </a>
      <nav class="navbar-links">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="shops.html" class="nav-link">Shops</a>
      </nav>
      <div class="navbar-actions">
        <a href="cart.html" class="cart-icon-btn"><i data-lucide="shopping-cart"></i><span class="cart-badge">0</span></a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:2.5rem; padding-bottom:4rem;">
    <h1 style="font-size:2.25rem; font-weight:800; color:var(--navy); margin-bottom:1.5rem;">Your Wishlist</h1>

    <div class="grid-4" id="wishlist-grid">
      <!-- Rendered dynamically -->
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 LocalCart Marketplace. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/customer.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderWishlistPage();
    });

    function renderWishlistPage() {
      const wishlist = getWishlist();
      const products = JSON.parse(localStorage.getItem("localcart_products") || "[]");
      const wishlistedProducts = products.filter(p => wishlist.includes(p.id));

      const grid = document.getElementById("wishlist-grid");

      if (wishlistedProducts.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1 / -1;">
            <div class="empty-state-icon"><i data-lucide="heart"></i></div>
            <h3>Your wishlist is empty</h3>
            <p>Save items you like by clicking the heart icon on any product.</p>
            <a href="shops.html" class="btn btn-primary">Explore Products</a>
          </div>
        `;
        renderIcons();
        return;
      }

      grid.innerHTML = wishlistedProducts.map(p => createProductCardHTML(p, true)).join("");
      renderIcons();
    }
  </script>
</body>
</html>
