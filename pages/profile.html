<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile — LocalCart</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar-inner">
      <a href="../index.html" class="logo"><i data-lucide="shopping-bag"></i> Local<span>Cart</span></a>
      <nav class="navbar-links">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="shops.html" class="nav-link">Shops</a>
      </nav>
      <div class="navbar-actions">
        <button class="btn btn-outline btn-sm" onclick="handleLogout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:2.5rem; padding-bottom:4rem; max-width:700px;">
    <h1 style="font-size:2.25rem; font-weight:800; color:var(--navy); margin-bottom:1.5rem;">Customer Account Profile</h1>

    <div class="card" style="padding:2rem;">
      <div style="display:flex; align-items:center; gap:1.5rem; margin-bottom:2rem;">
        <div style="width:80px; height:80px; border-radius:50%; background:var(--primary); color:white; display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:800;">
          J
        </div>
        <div>
          <h2 style="font-size:1.5rem; color:var(--navy);" id="profile-name">Jagan Mohan</h2>
          <div style="color:var(--muted);" id="profile-email">jagan@example.com</div>
          <span class="badge badge-success" style="margin-top:0.4rem;">Customer Account</span>
        </div>
      </div>

      <form onsubmit="event.preventDefault(); showToast('Profile updated successfully!', 'success');">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" value="Jagan Mohan">
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" value="+91 98450 12345">
        </div>
        <div class="form-group">
          <label class="form-label">Saved Delivery Address</label>
          <textarea class="form-control" rows="3">Flat 402, Sunrise Apartments, 12th Cross, Indiranagar, Bengaluru - 560038</textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Save Profile Changes</button>
      </form>
    </div>
  </main>

  <nav class="mobile-bottom-nav">
    <div class="mobile-nav-items">
      <a href="../index.html" class="mobile-nav-item"><i data-lucide="home"></i><span>Home</span></a>
      <a href="shops.html" class="mobile-nav-item"><i data-lucide="store"></i><span>Shops</span></a>
      <a href="cart.html" class="mobile-nav-item"><i data-lucide="shopping-cart"></i><span>Cart</span><span class="mobile-nav-badge">0</span></a>
      <a href="orders.html" class="mobile-nav-item"><i data-lucide="package"></i><span>Orders</span></a>
      <a href="profile.html" class="mobile-nav-item active"><i data-lucide="user"></i><span>Profile</span></a>
    </div>
  </nav>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
