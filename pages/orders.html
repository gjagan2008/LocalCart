<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History — LocalCart</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar-inner">
      <a href="../index.html" class="logo">
        <i data-lucide="shopping-bag"></i> Local<span>Cart</span>
      </a>
      <nav class="navbar-links">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="shops.html" class="nav-link">Shops</a>
        <a href="orders.html" class="nav-link active">Orders</a>
      </nav>
      <div class="navbar-actions">
        <a href="cart.html" class="cart-icon-btn">
          <i data-lucide="shopping-cart"></i>
          <span class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:2.5rem; padding-bottom:4rem;">
    <h1 style="font-size:2.25rem; font-weight:800; color:var(--navy); margin-bottom:1.5rem;">Your Orders</h1>

    <div id="customer-orders-list" style="display:flex; flex-direction:column; gap:1.25rem;">
      <!-- Rendered dynamically -->
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 LocalCart Marketplace. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav">
    <div class="mobile-nav-items">
      <a href="../index.html" class="mobile-nav-item"><i data-lucide="home"></i><span>Home</span></a>
      <a href="shops.html" class="mobile-nav-item"><i data-lucide="store"></i><span>Shops</span></a>
      <a href="cart.html" class="mobile-nav-item"><i data-lucide="shopping-cart"></i><span>Cart</span><span class="mobile-nav-badge">0</span></a>
      <a href="orders.html" class="mobile-nav-item active"><i data-lucide="package"></i><span>Orders</span></a>
      <a href="profile.html" class="mobile-nav-item"><i data-lucide="user"></i><span>Profile</span></a>
    </div>
  </nav>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/orders.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderCustomerOrdersHistory();
    });

    function renderCustomerOrdersHistory() {
      const orders = JSON.parse(localStorage.getItem("localcart_orders") || "[]");
      const container = document.getElementById("customer-orders-list");

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon"><i data-lucide="package"></i></div>
            <h3>No past orders found</h3>
            <p>Place your first order from local stores nearby!</p>
            <a href="shops.html" class="btn btn-primary">Explore Shops</a>
          </div>
        `;
        renderIcons();
        return;
      }

      container.innerHTML = orders.map(ord => `
        <div class="card" style="padding:1.5rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem; border-bottom:1px solid var(--border); padding-bottom:1rem;">
            <div>
              <span style="font-size:0.8rem; font-weight:700; color:var(--muted); text-transform:uppercase;">ORDER #${ord.id}</span>
              <h3 style="font-size:1.2rem; color:var(--navy);">${ord.shopName}</h3>
              <div style="font-size:0.85rem; color:var(--muted);">${ord.date}</div>
            </div>
            <div style="text-align:right;">
              <span class="badge ${ord.status === 'DELIVERED' ? 'badge-success' : 'badge-accent'}" style="margin-bottom:0.3rem;">${ord.status}</span>
              <div style="font-size:1.25rem; font-weight:800; color:var(--navy);">${formatINR(ord.total)}</div>
            </div>
          </div>

          <div style="margin-bottom:1rem;">
            <div style="font-size:0.88rem; color:var(--text);">${ord.items.map(i => `${i.name} (x${i.qty})`).join(', ')}</div>
          </div>

          <div style="display:flex; justify-content:flex-end; gap:0.75rem;">
            <a href="order-tracking.html?id=${ord.id}" class="btn btn-outline btn-sm">Track Order</a>
            <button class="btn btn-primary btn-sm" onclick="addToCart('${ord.items[0].id}')">Reorder Item</button>
          </div>
        </div>
      `).join("");

      renderIcons();
    }
  </script>
</body>
</html>
