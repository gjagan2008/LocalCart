<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — LocalCart</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="background:linear-gradient(135deg, var(--background) 0%, #e2e8f0 100%); justify-content:center; align-items:center;">

  <div class="container" style="max-width:440px; padding:2rem 1rem;">
    <div class="text-center" style="margin-bottom:2rem;">
      <a href="../index.html" class="logo" style="justify-content:center; font-size:1.8rem;">
        <i data-lucide="shopping-bag"></i> Local<span>Cart</span>
      </a>
      <p style="color:var(--muted); margin-top:0.5rem;">Welcome back! Log in to your account</p>
    </div>

    <div class="card" style="padding:2rem;">
      <!-- Role Switcher Tabs -->
      <div style="display:flex; background:var(--background); padding:4px; border-radius:var(--radius-md); margin-bottom:1.5rem;">
        <button class="btn btn-sm role-tab active" style="flex:1;" id="role-cust-btn" onclick="selectLoginRole('Customer')">Customer</button>
        <button class="btn btn-sm role-tab" style="flex:1;" id="role-seller-btn" onclick="selectLoginRole('Seller')">Seller</button>
        <button class="btn btn-sm role-tab" style="flex:1;" id="role-admin-btn" onclick="selectLoginRole('Admin')">Admin</button>
      </div>

      <form id="login-form" onsubmit="event.preventDefault(); submitLoginForm();">
        <input type="hidden" id="login-role" value="Customer">

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@example.com" value="jagan@example.com" required>
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between;">
            <label class="form-label">Password</label>
            <a href="#" style="font-size:0.8rem; color:var(--primary); font-weight:600;">Forgot?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" value="password123" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem; padding:0.85rem;">
          Log In to LocalCart
        </button>
      </form>

      <!-- Quick Demo Login Presets -->
      <div style="margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--border); text-align:center;">
        <div style="font-size:0.75rem; font-weight:700; color:var(--muted); text-transform:uppercase; margin-bottom:0.75rem;">⚡ Quick Demo Login</div>
        <div style="display:flex; gap:0.5rem; justify-content:center;">
          <button class="btn btn-outline btn-sm" onclick="quickDemoLogin('jagan@example.com', 'Customer')">Customer</button>
          <button class="btn btn-outline btn-sm" onclick="quickDemoLogin('murugan@stores.com', 'Seller')">Seller</button>
          <button class="btn btn-outline btn-sm" onclick="quickDemoLogin('admin@localcart.com', 'Admin')">Admin</button>
        </div>
      </div>
    </div>

    <div class="text-center" style="margin-top:1.5rem; font-size:0.9rem; color:var(--muted);">
      Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:700;">Register here</a>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    function selectLoginRole(role) {
      document.getElementById('login-role').value = role;
      document.querySelectorAll('.role-tab').forEach(b => b.classList.remove('active', 'btn-primary'));
      if (role === 'Customer') document.getElementById('role-cust-btn').classList.add('active');
      if (role === 'Seller') document.getElementById('role-seller-btn').classList.add('active');
      if (role === 'Admin') document.getElementById('role-admin-btn').classList.add('active');

      if (role === 'Seller') document.getElementById('login-email').value = 'murugan@stores.com';
      else if (role === 'Admin') document.getElementById('login-email').value = 'admin@localcart.com';
      else document.getElementById('login-email').value = 'jagan@example.com';
    }

    function submitLoginForm() {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const role = document.getElementById('login-role').value;
      handleLogin(email, pass, role);
    }

    function quickDemoLogin(email, role) {
      handleLogin(email, 'password123', role);
    }
  </script>
</body>
</html>
