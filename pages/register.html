<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — LocalCart</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="background:linear-gradient(135deg, var(--background) 0%, #e2e8f0 100%); justify-content:center; align-items:center;">

  <div class="container" style="max-width:480px; padding:2rem 1rem;">
    <div class="text-center" style="margin-bottom:1.5rem;">
      <a href="../index.html" class="logo" style="justify-content:center; font-size:1.8rem;">
        <i data-lucide="shopping-bag"></i> Local<span>Cart</span>
      </a>
      <p style="color:var(--muted); margin-top:0.5rem;">Create your account to start shopping or selling</p>
    </div>

    <div class="card" style="padding:2rem;">
      <form id="register-form" onsubmit="event.preventDefault(); submitRegister();">
        <div class="form-group">
          <label class="form-label">I want to register as a:</label>
          <div style="display:flex; gap:1rem;">
            <label style="flex:1; border:1.5px solid var(--border); padding:0.75rem; border-radius:var(--radius-md); text-align:center; cursor:pointer; font-weight:700;">
              <input type="radio" name="reg-role" value="Customer" checked style="margin-right:0.3rem;"> Customer
            </label>
            <label style="flex:1; border:1.5px solid var(--border); padding:0.75rem; border-radius:var(--radius-md); text-align:center; cursor:pointer; font-weight:700;">
              <input type="radio" name="reg-role" value="Seller" style="margin-right:0.3rem;"> Shop Owner / Seller
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Jagan Mohan" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Create strong password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem; padding:0.85rem;">
          Create Account
        </button>
      </form>
    </div>

    <div class="text-center" style="margin-top:1.5rem; font-size:0.9rem; color:var(--muted);">
      Already have an account? <a href="login.html" style="color:var(--primary); font-weight:700;">Log in here</a>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    function submitRegister() {
      const name = document.getElementById("reg-name").value;
      const email = document.getElementById("reg-email").value;
      const phone = document.getElementById("reg-phone").value;
      const role = document.querySelector('input[name="reg-role"]:checked').value;
      handleRegister(name, email, role, phone);
    }
  </script>
</body>
</html>
