<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform Settings — Admin Panel</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/seller.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="dashboard-layout">
    <aside class="sidebar" style="background:#0b1d2d;">
      <div class="sidebar-brand"><i data-lucide="shield"></i> Admin<span>Panel</span></div>
      <div class="sidebar-menu">
        <a href="dashboard.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="users.html" class="sidebar-link"><i data-lucide="users"></i> User Management</a>
        <a href="sellers.html" class="sidebar-link"><i data-lucide="user-check"></i> Seller Approvals</a>
        <a href="shops.html" class="sidebar-link"><i data-lucide="store"></i> Shops</a>
        <a href="products.html" class="sidebar-link"><i data-lucide="package"></i> Products</a>
        <a href="categories.html" class="sidebar-link"><i data-lucide="tag"></i> Categories</a>
        <a href="orders.html" class="sidebar-link"><i data-lucide="shopping-cart"></i> Orders</a>
        <a href="complaints.html" class="sidebar-link"><i data-lucide="message-square"></i> Complaints</a>
        <a href="revenue.html" class="sidebar-link"><i data-lucide="trending-up"></i> Revenue</a>
        <a href="settings.html" class="sidebar-link active"><i data-lucide="settings"></i> Platform Settings</a>
      </div>
      <div class="sidebar-footer">
        <button class="sidebar-link" onclick="handleLogout()"><i data-lucide="log-out"></i> Logout</button>
      </div>
    </aside>

    <div style="display:flex; flex-direction:column; min-height:100vh;">
      <header class="dashboard-header">
        <h2 style="font-size:1.4rem; font-weight:800; color:var(--navy);">Platform Configuration</h2>
      </header>

      <main class="dashboard-main" style="flex-grow:1;">
        <div class="card" style="padding:2rem; max-width:600px;">
          <h3>Commission & Delivery Rules</h3>
          <form onsubmit="event.preventDefault(); showToast('Platform settings saved!', 'success');">
            <div class="form-group" style="margin-top:1rem;">
              <label class="form-label">Seller Commission Rate (%)</label>
              <input type="number" class="form-control" value="5">
            </div>
            <div class="form-group">
              <label class="form-label">Default Delivery Radius (km)</label>
              <input type="number" class="form-control" value="5">
            </div>
            <div class="form-group">
              <label class="form-label">Minimum Order for Free Delivery (₹)</label>
              <input type="number" class="form-control" value="499">
            </div>
            <button type="submit" class="btn btn-primary">Save Platform Config</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
