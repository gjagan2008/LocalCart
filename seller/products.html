<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products — Seller Portal</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/seller.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><i data-lucide="shopping-bag"></i> Seller<span>Portal</span></div>
      <div class="sidebar-menu">
        <a href="dashboard.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="shop.html" class="sidebar-link"><i data-lucide="store"></i> My Shop</a>
        <a href="products.html" class="sidebar-link active"><i data-lucide="package"></i> Products</a>
        <a href="add-product.html" class="sidebar-link"><i data-lucide="plus-circle"></i> Add Product</a>
        <a href="orders.html" class="sidebar-link"><i data-lucide="shopping-cart"></i> Orders</a>
        <a href="inventory.html" class="sidebar-link"><i data-lucide="layers"></i> Inventory</a>
        <a href="reviews.html" class="sidebar-link"><i data-lucide="star"></i> Reviews</a>
        <a href="analytics.html" class="sidebar-link"><i data-lucide="bar-chart-2"></i> Analytics</a>
        <a href="settings.html" class="sidebar-link"><i data-lucide="settings"></i> Settings</a>
      </div>
      <div class="sidebar-footer">
        <button class="sidebar-link" onclick="handleLogout()"><i data-lucide="log-out"></i> Logout</button>
      </div>
    </aside>

    <div style="display:flex; flex-direction:column; min-height:100vh;">
      <header class="dashboard-header">
        <h2 style="font-size:1.4rem; font-weight:800; color:var(--navy);">Products Catalog</h2>
        <a href="add-product.html" class="btn btn-primary btn-sm"><i data-lucide="plus"></i> Add New Product</a>
      </header>

      <main class="dashboard-main" style="flex-grow:1;">
        <div class="data-table-card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="seller-products-body">
                <!-- Dynamic render -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/seller.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderSellerProductsTable();
    });
  </script>
</body>
</html>
