<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product — Seller Portal</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/seller.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><i data-lucide="shopping-bag"></i> Seller<span>Portal</span></div>
      <div class="sidebar-menu">
        <a href="dashboard.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="shop.html" class="sidebar-link"><i data-lucide="store"></i> My Shop</a>
        <a href="products.html" class="sidebar-link"><i data-lucide="package"></i> Products</a>
        <a href="add-product.html" class="sidebar-link active"><i data-lucide="plus-circle"></i> Add Product</a>
        <a href="orders.html" class="sidebar-link"><i data-lucide="shopping-cart"></i> Orders</a>
        <a href="inventory.html" class="sidebar-link"><i data-lucide="layers"></i> Inventory</a>
        <a href="reviews.html" class="sidebar-link"><i data-lucide="star"></i> Reviews</a>
        <a href="analytics.html" class="sidebar-link"><i data-lucide="bar-chart-2"></i> Analytics</a>
        <a href="settings.html" class="sidebar-link"><i data-lucide="settings"></i> Settings</a>
      </div>
      <div class="sidebar-footer">
        <button class="sidebar-link" onclick="handleLogout()"><i data-lucide="log-out"></i> Logout</button>
      </div>
    </aside>

    <div style="display:flex; flex-direction:column; min-height:100vh;">
      <header class="dashboard-header">
        <h2 style="font-size:1.4rem; font-weight:800; color:var(--navy);">Add New Product</h2>
        <a href="products.html" class="btn btn-outline btn-sm">Cancel</a>
      </header>

      <main class="dashboard-main" style="flex-grow:1;">
        <div class="card" style="padding:2rem; max-width:720px; margin:0 auto;">
          <form onsubmit="event.preventDefault(); submitNewProductForm();">
            <div class="form-group">
              <label class="form-label">Product Name</label>
              <input type="text" id="add-p-name" class="form-control" placeholder="e.g. Organic Basmati Rice 5kg" required>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
              <div class="form-group">
                <label class="form-label">Category</label>
                <select id="add-p-cat" class="form-control" required>
                  <option value="Grocery">Grocery</option>
                  <option value="Vegetables">Vegetables</option>
                  <option value="Pharmacy">Pharmacy</option>
                  <option value="Bakery">Bakery</option>
                  <option value="Electronics">Electronics</option>
                  <option value="Stationery">Stationery</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label">Price (₹ INR)</label>
                <input type="number" id="add-p-price" class="form-control" placeholder="e.g. 299" required>
              </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
              <div class="form-group">
                <label class="form-label">Stock Quantity</label>
                <input type="number" id="add-p-stock" class="form-control" placeholder="e.g. 50" required>
              </div>

              <div class="form-group">
                <label class="form-label">Unit Specification</label>
                <input type="text" id="add-p-unit" class="form-control" placeholder="e.g. 1 kg / 500 grams / 1 Pack" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Product Image URL</label>
              <input type="url" id="add-p-image" class="form-control" placeholder="https://images.unsplash.com/photo-..." value="https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=400&q=80">
            </div>

            <div class="form-group">
              <label class="form-label">Description</label>
              <textarea id="add-p-desc" class="form-control" rows="3" placeholder="Enter product description and features..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:1rem;">
              Publish Product to Marketplace
            </button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/seller.js"></script>
  <script>
    function submitNewProductForm() {
      const name = document.getElementById("add-p-name").value;
      const cat = document.getElementById("add-p-cat").value;
      const price = document.getElementById("add-p-price").value;
      const stock = document.getElementById("add-p-stock").value;
      const unit = document.getElementById("add-p-unit").value;
      const img = document.getElementById("add-p-image").value;
      const desc = document.getElementById("add-p-desc").value;

      addNewProduct(name, cat, price, stock, unit, img, desc);
      setTimeout(() => window.location.href = "products.html", 700);
    }
  </script>
</body>
</html>
