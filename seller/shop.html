<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shop Profile — Seller Portal</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/seller.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><i data-lucide="shopping-bag"></i> Seller<span>Portal</span></div>
      <div class="sidebar-menu">
        <a href="dashboard.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="shop.html" class="sidebar-link active"><i data-lucide="store"></i> My Shop</a>
        <a href="products.html" class="sidebar-link"><i data-lucide="package"></i> Products</a>
        <a href="add-product.html" class="sidebar-link"><i data-lucide="plus-circle"></i> Add Product</a>
        <a href="orders.html" class="sidebar-link"><i data-lucide="shopping-cart"></i> Orders</a>
        <a href="inventory.html" class="sidebar-link"><i data-lucide="layers"></i> Inventory</a>
        <a href="reviews.html" class="sidebar-link"><i data-lucide="star"></i> Reviews</a>
        <a href="analytics.html" class="sidebar-link"><i data-lucide="bar-chart-2"></i> Analytics</a>
        <a href="settings.html" class="sidebar-link"><i data-lucide="settings"></i> Settings</a>
      </div>
      <div class="sidebar-footer">
        <button class="sidebar-link" onclick="handleLogout()"><i data-lucide="log-out"></i> Logout</button>
      </div>
    </aside>

    <div style="display:flex; flex-direction:column; min-height:100vh;">
      <header class="dashboard-header">
        <h2 style="font-size:1.4rem; font-weight:800; color:var(--navy);">My Store Settings & Profile</h2>
      </header>

      <main class="dashboard-main" style="flex-grow:1;">
        <div class="card" style="padding:2rem; max-width:760px;">
          <form onsubmit="event.preventDefault(); showToast('Shop profile updated!', 'success');">
            <div class="form-group">
              <label class="form-label">Shop Name</label>
              <input type="text" class="form-control" value="Sri Murugan Stores">
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
              <div class="form-group">
                <label class="form-label">Primary Category</label>
                <select class="form-control">
                  <option selected>Grocery</option>
                  <option>Vegetables</option>
                  <option>Pharmacy</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Store Hours</label>
                <input type="text" class="form-control" value="7:00 AM - 10:00 PM">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Physical Address</label>
              <input type="text" class="form-control" value="124 M.G. Road, Indiranagar, Bengaluru">
            </div>

            <div class="form-group">
              <label class="form-label">Store Phone Number</label>
              <input type="tel" class="form-control" value="+91 98765 43210">
            </div>

            <div class="form-group">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="3">Your trusted local supermarket for daily essentials, fresh pulses, spices, and branded groceries.</textarea>
            </div>

            <button type="submit" class="btn btn-primary">Save Shop Changes</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
